; ════════════════════════════════════════════════════════════════════════════
; SLAMborghini — Wemos D1 R32 standalone SLAM brain
; (temporary single-board setup while ESP32-S3 is unavailable)
;
; Source files are declared in wemos/main/CMakeLists.txt (ESP-IDF requirement).
; build_src_filter does NOT work with the ESP-IDF framework.
; ════════════════════════════════════════════════════════════════════════════

[platformio]
; Point src_dir at main/ so PlatformIO uses main/CMakeLists.txt and does NOT
; auto-generate an __idf_src component from wemos/src/ (which would conflict).
src_dir = main

[env:wemos_slam]
platform  = espressif32@6.7.0
board     = esp32dev
framework = espidf

; ── Serial monitor ──────────────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; ── Extra compiler flags (include paths) ────────────────────────────────────
; These supplement the INCLUDE_DIRS in main/CMakeLists.txt.
build_flags =
    -I${PROJECT_DIR}/../esp32s3/src
    -I${PROJECT_DIR}/..

; ── Upload ──────────────────────────────────────────────────────────────────
; PlatformIO auto-detects the port.  Uncomment if needed:
; upload_port = /dev/tty.usbserial-0001   ; macOS

; ── ESP-IDF Kconfig ─────────────────────────────────────────────────────────
; sdkconfig.defaults in this directory enables CONFIG_HTTPD_WS_SUPPORT=y
