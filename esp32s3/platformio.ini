; ════════════════════════════════════════════════════════════════════════════
; SLAMborghini — ESP32-S3 SLAM Brain
; PlatformIO project configuration
;
; Board: ESP32-S3-DevKitC-1 (change `board` if you have a different variant)
; Framework: ESP-IDF
; ════════════════════════════════════════════════════════════════════════════

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1   ; ← change if needed (e.g. seeed_xiao_esp32s3)
framework = espidf
board_upload.flash_size = 2MB

; ── Serial monitor ──────────────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; ── Source layout ───────────────────────────────────────────────────────────
; ESP-IDF ignores src_filter — source selection is done in src/CMakeLists.txt.
; main.c is registered explicitly there alongside the src/ glob.

; ── Upload ──────────────────────────────────────────────────────────────────
; PlatformIO auto-detects the port. Uncomment and set explicitly if needed:
; upload_port = /dev/tty.usbserial-0001   ; macOS example
; upload_port = COM3                       ; Windows example

; ── ESP-IDF Kconfig overrides ───────────────────────────────────────────────
; sdkconfig.defaults (same directory as this file) enables:
;   CONFIG_HTTPD_WS_SUPPORT=y   ← required for wifi_dashboard WebSocket
; PlatformIO applies sdkconfig.defaults automatically.
