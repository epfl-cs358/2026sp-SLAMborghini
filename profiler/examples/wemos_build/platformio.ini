; SLAMborghini profiler — Wemos D1 R32 (ESP32) build
;
; Default: real-hardware odometry (ICM-20948 + AS5600)
; To run the UART stress echo (pair with S3 ENABLE_UART_BRIDGE=1):
;   set ENABLE_ODOMETRY=0 and ENABLE_UART_ECHO=1

[platformio]
src_dir = main

[env:wemos_profiler]
platform  = espressif32
board     = wemos_d1_uno32
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

build_flags =
    -DPROFILER_ENABLED=1
    -DENABLE_ODOMETRY=0
    -DENABLE_UART_ECHO=1
    ; To run UART echo instead:
    ; -DENABLE_ODOMETRY=0
    ; -DENABLE_UART_ECHO=1

; upload_port   = /dev/cu.usbserial-0001
; monitor_port  = /dev/cu.usbserial-0001
