; SLAMborghini profiler — Wemos D1 R32 (ESP32) build
;
; Tests: synthetic odometry at 100 Hz (no hardware required)

[platformio]
src_dir = main

[env:wemos_profiler]
platform  = espressif32
board     = wemos_d1_uno32
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

build_flags =
    -DPROFILER_ENABLED=1

; upload_port   = /dev/cu.usbserial-0001
; monitor_port  = /dev/cu.usbserial-0001
