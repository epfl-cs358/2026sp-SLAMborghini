; SLAMborghini profiler — ESP32-S3 build
;
; Default: unit tests only (quadtree, lidar_to_map, frontier, astar)
; See profiler/examples/esp32s3/main.c for all ENABLE_* flags.
;
; To enable hardware perfmon counters, uncomment the perfmon build flag.
; To run the full SLAM pipeline test, add: -DENABLE_PIPELINE_FULL=1

[env:esp32s3_profiler]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

build_flags =
    -DPROFILER_ENABLED=1
    ; -DPROFILER_USE_PERFMON    ; uncomment to enable Xtensa perfmon counters
    ; -DENABLE_PIPELINE_FULL=1  ; full SLAM loop (scan→map→frontier→astar)

; Port is auto-detected. Set explicitly if needed:
; upload_port   = /dev/cu.usbmodem101
; monitor_port  = /dev/cu.usbmodem101
