; SLAMborghini profiler — ESP32-S3 build
;
; Default: Hybrid A* unit test only
; See profiler/examples/esp32s3/main.c for all ENABLE_* flags.
;
; To run the UART stress test (ramp 10→500 Hz, find performance cliff):
;   -DENABLE_UART_BRIDGE=1  (+ flash Wemos with ENABLE_UART_ECHO=1)
; To enable hardware perfmon counters, uncomment the perfmon build flag.
; To run the full SLAM pipeline test, add: -DENABLE_PIPELINE_FULL=1

[platformio]
; Point PlatformIO's src-dir check at main/ (which exists).
; The actual build is driven by the native ESP-IDF CMakeLists.txt hierarchy.
src_dir = main

[env:esp32s3_profiler]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

build_flags =
    -DPROFILER_ENABLED=1
    -DENABLE_LIDAR_DRIVER=0
    -DENABLE_QUADTREE=0
    -DENABLE_LIDAR_TO_MAP=0
    -DENABLE_FRONTIER=0
    -DENABLE_HYBRID_ASTAR=0
    -DENABLE_UART_BRIDGE=1
    -DENABLE_WIFI_DASHBOARD=0
    -DENABLE_PIPELINE_LIDAR_WIFI=0
    -DTEST_WIFI_SSID='"SPOT-iot"'
    -DTEST_WIFI_PASS='"RacailleSalutaireMigration8052"'
    ; -DPROFILER_USE_PERFMON          ; uncomment for cache miss / IPC / branch counters
    ; -DENABLE_PIPELINE_FULL=1        ; full SLAM loop (scan→map→frontier→astar)
    ; -DENABLE_PIPELINE_LIDAR_WIFI=1  ; real LiDAR + map + WiFi dashboard
    ; -DENABLE_WIFI_DASHBOARD=1       ; WiFi dashboard unit test only (no LiDAR)

; Port is auto-detected. Set explicitly if needed:
; upload_port   = /dev/cu.usbmodem101
; monitor_port  = /dev/cu.usbmodem101
